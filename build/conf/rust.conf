# HAVE_RUST is the single place that answers "can this platform build rust at
# all". A ya.make guards its RECURSE with it, which is what lets the rust
# examples sit in the common tutorial tree without breaking the platforms that
# have no toolchain in build/platform/rust yet.
when ($OS_LINUX == "yes" && $ARCH_X86_64 == "yes") {
    RUST_ARCH=x86_64
    RUST_ABI=unknown-linux-gnu
    HAVE_RUST=yes
}
elsewhen ($OS_DARWIN == "yes" && $ARCH_ARM64 == "yes") {
    RUST_ARCH=aarch64
    RUST_ABI=apple-darwin
    HAVE_RUST=yes
}
elsewhen ($OS_DARWIN == "yes" && $ARCH_X86_64 == "yes") {
    RUST_ARCH=x86_64
    RUST_ABI=apple-darwin
    HAVE_RUST=yes
}
otherwise {
    RUST_ARCH=
    RUST_ABI=
    HAVE_RUST=no
}
RUST_TARGET=${RUST_ARCH}-${RUST_ABI}
RUST_STD=${RUST_RESOURCE_GLOBAL}/rust-std-$RUST_TARGET/lib/rustlib/$RUST_TARGET/lib

module _RUST_UNIT {
    .DEFAULT_NAME_GENERATOR=DirName
    .ARGS_PARSER=Base
    .EXTS=.rs
    .PEERDIR_POLICY=as_build_from
    .NODE_TYPE=Bundle
    .GLOBAL=_RUST_EXTERN
    .CMD=${RUST_RESOURCE_GLOBAL}/rustc/bin/rustc --help

    PEERDIR+=build/platform/rust
    PEERDIR+=$YMAKE_PYTHON3_PEERDIR

    # Read by the test machinery when a dart record is built (RUST_TEST,
    # RUST_BENCH); every language sets it on its base unit.
    SET(MODULE_LANG RUST)

    # Without a toolchain RUST_TARGET evaluates to a bare "-" and RUST_STD
    # points into a directory that does not exist, so the module would
    # configure cleanly and fail deep inside rustc. HAVE_RUST is checked here
    # and not only where a ya.make guards its RECURSE, because nothing stops a
    # RUST_* module from being written outside a guarded directory. This is the
    # mechanism _BARE_UNIT uses for the same purpose.
    when ($HAVE_RUST != "yes") {
        FATAL_ERROR_MESSAGE+=No rust toolchain for this platform, see HAVE_RUST in build/conf/rust.conf
        PEERDIR+=build/conf_fatal_error
    }
}

# $PEERS carries both rust crates and native (C/C++) libraries, and the two
# reach rustc in completely different ways, so the list is split by extension.
#
# Crates are gathered into ${BINDIR}/deps and native libraries into
# ${BINDIR}/native, each passed as its own `-L`. `-L native=` is what makes
# `#[link(name = ...)]` attributes in the sources resolve.
#
# A proc-macro artifact is a dynamic library too, and rustc insists on the
# platform extension for it (any other name is rejected as "of an unknown
# type"), so extension alone cannot tell the two apart. RUST_PROC_MACRO marks
# itself with a module tag -- which is what tags are for -- and native gathering
# filters it back out. It needs no gathering of its own: it reaches rustc as an
# `--extern`, published the same way crates publish theirs.
_RUST_NATIVE_PEERS=\
    ${ext=.a:PEERS} \
    ${tags_out=RUST_PROC_MACRO;ext=.so:PEERS} \
    ${tags_out=RUST_PROC_MACRO;ext=.dylib:PEERS}
# A proc-macro artifact belongs in ${BINDIR}/deps together with the rlibs, and
# not because anything there needs a search path of its own: `--extern` covers a
# module's direct dependencies only, and a crate that pulls a derive macro in
# behind one -- thiserror behind ytsaurus-yson, say -- is loaded by resolving
# that macro through `-L` first. Leave the dylib off every search path and the
# error names the innocent parent: "can't find crate for `thiserror`".
_RUST_PROC_MACRO_PEERS=\
    ${tags_in=RUST_PROC_MACRO;ext=.so:PEERS} \
    ${tags_in=RUST_PROC_MACRO;ext=.dylib:PEERS}
_GATHER_RUST_PEERS=\
    $FS_TOOLS md ${BINDIR}/deps \
    && $FS_TOOLS md ${BINDIR}/native \
    && $FS_TOOLS link_or_copy_to_dir --no-check ${ext=.rlib:PEERS} ${BINDIR}/deps \
    && $FS_TOOLS link_or_copy_to_dir --no-check $_RUST_PROC_MACRO_PEERS ${BINDIR}/deps \
    && $FS_TOOLS link_or_copy_to_dir --no-check $_RUST_NATIVE_PEERS ${BINDIR}/native

# A search path alone is not enough: nothing in a hand-written `extern "C"`
# block makes rustc pull an archive into the link, so native peers are also
# listed explicitly, by full path.
#
# `-l static=<name>` would be the idiomatic spelling, but it needs the `lib`
# prefix cut off the artifact name, and no modifier can cut a prefix (`pre=`
# and `suf=` only prepend and append). `-l static:+verbatim=` is not a way out
# either: it lowers to `-l:<file>`, which ld64 does not understand.
# NB: `tags_cut` is mandatory before `pre`. $PEERS evaluates to a tagged string
# list, and `pre` only accepts plain ones.
_RUST_NATIVE_LINK_FLAGS=\
    ${pre=-Clink-arg=;tags_cut;ext=.a:PEERS} \
    ${pre=-Clink-arg=;tags_cut;tags_out=RUST_PROC_MACRO;ext=.so:PEERS} \
    ${pre=-Clink-arg=;tags_cut;tags_out=RUST_PROC_MACRO;ext=.dylib:PEERS}

# One `--extern <crate name>=<path>` per rlib peer, so sources resolve crates
# without `extern crate` declarations, and so a crate whose name differs from
# its directory is reachable at all: rustc's `-L` lookup matches on the file
# name (`lib<crate>.rlib`), never on crate metadata, so `contrib/rust/serde-json`
# holding crate `serde_json` cannot be found through a search path.
#
# Each crate publishes its own flag into _RUST_EXTERN_GLOBAL (declared by
# .GLOBAL on _RUST_UNIT) and consumers receive the union over their peer
# closure, so nothing here has to map an artifact path back to the module that
# produced it. The value is built in the crate's own variable context, which is
# what lets it name itself.
#
# A module's own contribution lands in the same variable, and a crate must not
# be handed an `--extern` pointing at the artifact it is in the middle of
# producing: rustc opens it as soon as anything in the crate names the crate,
# which is common enough (`anyhow` does it) to matter. Hence the exclusion.
#
# The artifact is spelled out rather than taken from $TARGET: a published value
# keeps per-module variables unexpanded until it is read, so $TARGET would
# resolve against whoever consumes the flag. $ARCADIA_BUILD_ROOT is safe to
# leave late -- it is one and the same directory for every module.
_RUST_ARTIFACT=$ARCADIA_BUILD_ROOT/$MODDIR/$MODULE_PREFIX$REALPRJNAME$MODULE_SUFFIX
_RUST_SELF_EXTERN=--extern=$RUST_CRATE_NAME=$_RUST_ARTIFACT
_RUST_CRATE_EXTERNS=${exclude=$_RUST_SELF_EXTERN:_RUST_EXTERN_GLOBAL}

macro _COMPILE_RUST(Src, Tgt, EDITION="2024", FLAGS[]) {
    .CMD=${env:_RUST_ENV} ${RUST_RESOURCE_GLOBAL}/rustc/bin/rustc -o $Tgt $FLAGS --edition $EDITION ${input:Src} ${hide;input;glob:"src/**/*.rs"} ${hide:AUTO_INPUTS} -L ${RUST_STD} -L ${BINDIR}/deps -L native=${BINDIR}/native $_RUST_CRATE_EXTERNS $_RUST_NATIVE_LINK_FLAGS
}

# tag:rust-specific
### @usage: RUST_PROGRAM([name])
###
### An executable built by rustc from src/main.rs.
###
### Every .rs file under src/ is an input, so modules are not listed anywhere:
### the crate root pulls them in with `mod` as usual. Name defaults to the
### directory name.
###
### PEERDIR accepts RUST_CRATE, RUST_PROC_MACRO and C/C++ libraries alike.
module RUST_PROGRAM: _RUST_UNIT {
    .PROXY=yes
    .FINAL_TARGET=yes
    .NODE_TYPE=Program
    .CMD=$_GATHER_RUST_PEERS && $_COMPILE_RUST(src/main.rs $TARGET EDITION $USE_RUST_EDITION FLAGS $_RUST_USER_FLAGS) ${kv:"p RP"}
}

# tag:rust-specific
### @usage: RUST_CRATE([name])
###
### A rust library for rust consumers, built from src/lib.rs as an rlib.
###
### This is the module to use for anything other rust code depends on,
### including everything under contrib/rust. Consumers address it by its crate
### name -- the module name, so the [name] argument when the directory is not a
### valid rust identifier -- and need no `extern crate` declaration.
###
### Use RUST_LIBRARY instead when the consumer is C/C++ or python.
module RUST_CRATE: _RUST_UNIT {
    .FINAL_TARGET=no
    .EPILOGUE=_RUST_CRATE_EPILOGUE
    .CMD=$_GATHER_RUST_PEERS && $_COMPILE_RUST(src/lib.rs $TARGET EDITION $USE_RUST_EDITION FLAGS --crate-name $RUST_CRATE_NAME --crate-type rlib $_RUST_USER_FLAGS) ${kv:"p RC"}

    ENABLE(PASS_PEERS)
    MODULE_SUFFIX=.rlib
    MODULE_PREFIX=lib
}

# How the crate name reaches a consumer's `--extern`. Both halves of the pair
# are known in the crate and nowhere else: the name is its variable, the path is
# its artifact, so it publishes the finished flag and consumers just concatenate.
#
# Runs from .EPILOGUE rather than the module body because the body is executed
# before the ya.make is read.
#
# A crate also receives its own flag this way, and that is not harmless: rustc
# opens an `--extern` as soon as anything in the crate names the crate, which
# crates do (`anyhow` has `pub use anyhow as format_err;`), and the artifact it
# would open is the one being produced right now. `exclude` in
# _RUST_CRATE_EXTERNS above is what takes it back out.
macro _RUST_CRATE_EPILOGUE() {
    SET_APPEND(_RUST_EXTERN_GLOBAL $_RUST_SELF_EXTERN)
}

# tag:rust-specific
### @usage: RUST_LIBRARY([name])
###
### A rust library for non-rust consumers, built from src/lib.rs as a staticlib.
###
### Link it into a C++ PROGRAM or a PY3_PROGRAM with a plain PEERDIR and call
### its `#[unsafe(no_mangle)] pub extern "C"` functions. The C/C++ libraries this
### module depends on reach the final link too.
###
### Use RUST_CRATE instead when the consumer is rust.
module RUST_LIBRARY: _RUST_UNIT {
    .FINAL_TARGET=no
    .NODE_TYPE=Library
    .PROXY=yes
    .CMD=$_GATHER_RUST_PEERS && $_COMPILE_RUST(src/lib.rs $TARGET EDITION $USE_RUST_EDITION FLAGS --crate-name $RUST_CRATE_NAME --crate-type staticlib $_RUST_USER_FLAGS) ${kv:"p RL"}

    # A staticlib does not embed its native peers: rustc runs no linker for this
    # crate type, so the `-Clink-arg=` flags above are inert here. Whoever links
    # this module into a final binary has to link those peers too, which only
    # happens if they are passed along.
    #
    # This cannot be left to the default. `.PEERDIR_POLICY=as_build_from` (needed
    # for $PEERS to be populated at all) sets UsePeers, which makes
    # IsCompleteTarget() true, which makes IsStaticLib() false -- so the default
    # PassPeers works out to "no" for this module.
    ENABLE(PASS_PEERS)
    MODULE_SUFFIX=.a
    MODULE_PREFIX=lib
}

# A proc-macro is compiled into the compiler, not into the program: rustc loads
# it while building whatever uses it, so it is a dynamic library and it belongs
# to the machine running the build.
#
# TODO: it is built for the target platform here, which is only correct while
# host and target agree. `tool` semantics -- building the module for the host --
# is what this ultimately needs, and it cannot be seen on a non-cross build.
# tag:rust-specific
### @usage: RUST_PROC_MACRO([name])
###
### A procedural macro crate, built from src/lib.rs as a proc-macro dylib.
###
### Unlike every other rust module this one is loaded by the compiler while its
### consumers are built, and is never linked into the resulting program. Needed
### by anything derive-based, serde included.
module RUST_PROC_MACRO: _RUST_UNIT {
    .FINAL_TARGET=no
    .EPILOGUE=_RUST_CRATE_EPILOGUE
    .CMD=$_GATHER_RUST_PEERS && $_COMPILE_RUST(src/lib.rs $TARGET EDITION $USE_RUST_EDITION FLAGS --crate-name $RUST_CRATE_NAME --crate-type proc-macro $_RUST_USER_FLAGS) ${kv:"p RM"}

    ENABLE(PASS_PEERS)
    MODULE_PREFIX=lib
    when ($OS_WINDOWS == "yes") {
        MODULE_SUFFIX=.dll
    }
    elsewhen ($OS_DARWIN == "yes") {
        MODULE_SUFFIX=.dylib
    }
    otherwise {
        MODULE_SUFFIX=.so
    }

    # Keeps the artifact out of native library gathering, which would otherwise
    # try to link a compiler plugin into the program.
    MODULE_TAG=RUST_PROC_MACRO

    # Tagging a module also restricts what it may PEERDIR to, and a proc macro
    # is an ordinary rust program as far as its own dependencies go: every real
    # one is built on syn and quote, which are untagged RUST_CRATEs.
    SET(PEERDIR_TAGS __EMPTY__ RUST_PROC_MACRO)
}

# NB: RUST_TEST and RUST_BENCH below build the same artifact -- one libtest
# binary from src/lib.rs -- and their .CMD lines have to be kept in sync by
# hand. Factoring the shared part out is not expressible: a multicommand (the
# `$_GATHER_RUST_PEERS &&` prefix) is only allowed at the top level of a .CMD,
# so neither a variable nor a macro holding it can be substituted into one --
# ymake rejects both with "unexpected multicommand substitution/call".

# tag:rust-specific tag:test
### @usage: RUST_TEST([name])
###
### A rust test binary, built from src/lib.rs with `rustc --test` and run by
### `ya make -t`. Every `#[test]` function in the crate is a testcase.
###
### The module holds the tests, not the code under test: PEERDIR the crate
### being tested, the way a cargo integration test (tests/*.rs) depends on its
### package. Unit tests living inside a RUST_CRATE's own sources are not
### reachable this way -- running those needs the crate recompiled with
### --test, which is a separate mechanism.
module RUST_TEST: _RUST_UNIT {
    .PROXY=yes
    .FINAL_TARGET=no
    .NODE_TYPE=Program
    .CMD=$_GATHER_RUST_PEERS && $_COMPILE_RUST(src/lib.rs $TARGET EDITION $USE_RUST_EDITION FLAGS --test $_RUST_USER_FLAGS) ${kv:"p RT"}

    ADD_YTEST($MODULE_PREFIX$REALPRJNAME rust.test)
}

# tag:rust-specific tag:test
### @usage: RUST_BENCH([name])
###
### A rust benchmark binary: src/lib.rs compiled with `rustc --test`, run with
### `--bench` by `ya make -t`. Every `#[bench]` function is a benchmark, and
### its ns/iter shows up as metrics in the test report, mirroring go.bench.
###
### `#[bench]` and the `test` crate are perma-unstable, so this module is
### compiled with RUSTC_BOOTSTRAP=1; the sources still have to declare
### `#![feature(test)]` and `extern crate test;`. The stable-world alternative
### is criterion with `harness = false`, which is an ordinary RUST_PROGRAM plus
### a contrib import -- once criterion is imported, benches that want it can
### use that shape instead.
module RUST_BENCH: _RUST_UNIT {
    .PROXY=yes
    .FINAL_TARGET=no
    .NODE_TYPE=Program
    .CMD=$_GATHER_RUST_PEERS && $_COMPILE_RUST(src/lib.rs $TARGET EDITION $USE_RUST_EDITION FLAGS --test $_RUST_USER_FLAGS) ${kv:"p RB"}

    SET_APPEND(_RUST_ENV RUSTC_BOOTSTRAP=1)

    ADD_YTEST($MODULE_PREFIX$REALPRJNAME rust.bench)
}

USE_RUST_EDITION=2024

# Extra rustc flags for one module, the escape hatch for everything the build
# description does not model yet: cargo features (`--cfg feature="std"`) and the
# `--cfg`s a crate's build.rs would otherwise set.
_RUST_USER_FLAGS=
# tag:rust-specific
### @usage: RUST_FLAGS(Flags...)
###
### Additional flags passed to rustc when compiling this module.
macro RUST_FLAGS(Flags...) {
    SET_APPEND(_RUST_USER_FLAGS $Flags)
}

_RUST_ENV=
# tag:rust-specific
### @usage: RUST_ENV(Var=Value...)
###
### Environment for the rustc invocation, which is to say the values `env!()`
### reads at compile time.
###
### Cargo defines a `CARGO_PKG_*` variable for every field of a crate's
### manifest, and crates use them: both serde_derive and thiserror-impl paste
### `CARGO_PKG_VERSION_PATCH` into a symbol name so that two versions of the
### crate can coexist in one binary. There is no cargo here, so an imported
### crate that reads one has to be told its value.
macro RUST_ENV(Vars...) {
    SET_APPEND(_RUST_ENV $Vars)
}

# tag:rust-specific
### @usage: RUST_EDITION(Edition)
###
### The rust edition the module is compiled with, defaulting to 2024.
###
### Set it in imported contribs and ported projects to whatever their Cargo.toml
### declares: edition governs semantics, not just syntax, so code written for
### 2021 should be built as 2021 even when the newer edition happens to accept
### it.
macro RUST_EDITION(Val) {
    SET(USE_RUST_EDITION $Val)
}

# The name a crate is known by to `--extern` and to `use` in rust sources. It
# has to be a valid rust identifier, and it cannot diverge from the artifact's
# file name: `--extern` covers a consumer's direct dependencies only, and a
# crate reached transitively is resolved by rustc through `-L`, by file name
# (`lib<crate name>.rlib`), never by crate metadata. Since the artifact name
# comes from the module name, the crate name simply follows it.
#
# The module name defaults to the directory name (.DEFAULT_NAME_GENERATOR=
# DirName), and contrib directories follow crates.io and carry dashes, which no
# identifier may. Such a crate passes the name as the module-name argument --
# `RUST_CRATE(serde_json)` in contrib/rust/serde-json -- which names the
# artifact and, through this default, the crate in one stroke.
#
# Two versions of one crate are writable the same way -- contrib/rust/syn-1 and
# contrib/rust/syn-2, distinct modules in distinct directories, both declaring
# RUST_CRATE(syn) -- but only as long as no module ends up with both in its peer
# closure. Both produce libsyn.rlib, _GATHER_RUST_PEERS gathers by base name, and
# the second link into ${BINDIR}/deps fails outright; even if it did not, the
# `-L` lookup that resolves transitive crates matches file names and could not
# tell the two apart. A program peerdiring one crate built on syn-1 and another
# built on syn-2 is therefore not expressible yet. See contrib/rust/Readme.md.
#
# There deliberately is no macro to set this variable alone. One existed
# (CRATE_NAME) and could not work: it renamed the crate but not the artifact,
# so the file-name lookup above missed every crate that used it.
RUST_CRATE_NAME=$REALPRJNAME
